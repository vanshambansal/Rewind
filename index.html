<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rewind</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="alternate icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23008080'/%3E%3Crect x='2' y='2' width='5' height='5' fill='%23ff4500'/%3E%3Crect x='9' y='2' width='5' height='5' fill='%234169e1'/%3E%3Crect x='2' y='9' width='5' height='5' fill='%23228b22'/%3E%3Crect x='9' y='9' width='5' height='5' fill='%23ffd700'/%3E%3C/svg%3E">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/desktop.css">
    <link rel="stylesheet" href="css/windows.css">
    <link rel="stylesheet" href="css/taskbar.css">
    <link rel="stylesheet" href="css/menus.css">
    <link rel="stylesheet" href="css/applications.css">
</head>
<body>

    <!-- Desktop Workspace -->
    <div id="desktop">
        <div id="desktop-icons"></div>
    </div>

    <!-- Windows Taskbar -->
    <div id="taskbar">
        <button id="start-button">
            <img id="start-button-icon" src="" alt="">
            <span>Start</span>
        </button>

        <div id="taskbar-divider"></div>

        <div id="task-buttons"></div>

        <div id="tray-divider"></div>

        <div id="system-tray">
            <img id="tray-sound" src="" alt="Sound" title="Volume">
            <span id="tray-clock"></span>
        </div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu">
        <div id="start-menu-sidebar"></div>
        <div id="start-menu-items"></div>
    </div>

    <!-- Desktop Context Menu -->
    <div id="context-menu"></div>

    <!-- Classic Shutdown Screen -->
    <div id="shutdown-screen">
        <p>It is now safe to turn off<br>your computer.</p>
    </div>

    <!-- Main Application Entry Point -->
    <script type="module" src="js/app.js"></script>

</body>
</html>
